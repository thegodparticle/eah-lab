<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUD 647 | Adult Rehabilitation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        'brand-bg': '#f8fafc',
                        'brand-primary': '#00205b', /* USA Blue */
                        'brand-accent': '#BF0D3E', /* USA Red */
                        'brand-teal': '#0d9488',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 1s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        
        /* Subtle Grid Background */
        .bg-grid {
            background-size: 40px 40px;
            background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
            opacity: 0.4;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        .text-gradient {
            background: linear-gradient(135deg, #00205b 0%, #BF0D3E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 200px);
            gap: 1rem;
        }

        .bento-item {
            position: relative; overflow: hidden; border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .bento-item:hover { transform: scale(1.02); z-index: 10; }
        
        /* Updated Image Styling for Full Coverage */
        .bento-item img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* This ensures the image covers the full box */
            transition: transform 0.5s ease; 
        }
        .bento-item:hover img { transform: scale(1.1); }

        .col-span-2 { grid-column: span 2; }
        .row-span-2 { grid-row: span 2; }

        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
            .col-span-2, .row-span-2 { grid-column: span 1; grid-row: span 1; }
            .bento-item { height: 200px; }
        }
    </style>
</head>
<body class="antialiased selection:bg-brand-primary selection:text-white">

    <div class="bg-grid"></div>
    
    <main class="relative z-10 w-full max-w-7xl mx-auto px-6 lg:px-12 py-12 lg:py-16 flex flex-col lg:flex-row items-center gap-10 lg:gap-16 min-h-[600px]">

        <div class="flex-1 text-center lg:text-left space-y-8 animate-fade-in-up">
            <div class="inline-block opacity-90">
                <span class="font-mono text-brand-accent tracking-[0.3em] text-sm font-bold uppercase py-2 border-b-2 border-brand-accent/20">
                    AUD 647
                </span>
            </div>

            <h1 class="text-5xl sm:text-6xl lg:text-7xl font-extrabold text-slate-900 tracking-tight leading-[1.1] select-none">
                Adult <br />
                <span class="text-gradient">Rehabilitation</span>
                <br /> & Aging
            </h1>

            <div class="flex flex-wrap justify-center lg:justify-start gap-3 text-sm font-medium text-slate-500">
                <span class="px-3 py-1 bg-white border border-slate-200 rounded-full shadow-sm">Therapy</span>
                <span class="px-3 py-1 bg-white border border-slate-200 rounded-full shadow-sm">Counseling</span>
                <span class="px-3 py-1 bg-white border border-slate-200 rounded-full shadow-sm">Neuroplasticity</span>
            </div>

            <div class="inline-block pt-4">
                <div class="flex items-center gap-4 px-6 py-3 bg-white/80 backdrop-blur-md border border-slate-200 rounded-full shadow-lg hover:shadow-xl transition-shadow cursor-default">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-brand-primary to-brand-accent p-[2px]">
                        <img src="https://ui-avatars.com/api/?name=Niyazi+Arslan&background=fff&color=00205b&bold=true" alt="Instructor" class="rounded-full w-full h-full">
                    </div>
                    <div class="text-left">
                        <span class="block text-[10px] uppercase tracking-widest text-slate-400 font-bold">Instructor</span>
                        <span class="text-slate-900 font-bold text-sm font-mono">Niyazi Arslan, Ph.D.</span>
                    </div>
                </div>
            </div>
            
            <div class="pt-6">
                <button onclick="document.getElementById('dashboard').scrollIntoView({behavior: 'smooth'})" class="inline-flex items-center gap-2 text-brand-primary font-bold hover:underline underline-offset-4 decoration-2">
                    Enter Course 
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="flex-1 w-full max-w-2xl animate-fade-in-up" style="animation-delay: 0.2s;">
            <div class="bento-grid p-4 bg-white/50 backdrop-blur-xl rounded-3xl border border-white/60 shadow-2xl">
                <div class="bento-item col-span-2">
                    <img src="https://images.unsplash.com/photo-1527235882674-8f8b0f7102dd?q=80&w=1740&auto=format&fit=crop" alt="Social Connection">
                </div>
                <div class="bento-item row-span-2">
                    <img src="https://images.unsplash.com/photo-1566616213894-2d4e1baee5d8?q=80&w=1742&auto=format&fit=crop" alt="Elderly Woman">
                </div>
                <div class="bento-item">
                    <img src="https://images.unsplash.com/photo-1587040273238-9ba47c714796?q=80&w=774&auto=format&fit=crop" alt="Technology">
                </div>
                <div class="bento-item">
                    <img src="https://images.unsplash.com/photo-1620256432380-13de77348873?q=80&w=774&auto=format&fit=crop" alt="Ear Model">
                </div>
            </div>
        </div>

    </main>

    <section id="dashboard" class="relative z-10 w-full max-w-5xl mx-auto px-6 pb-20 pt-8">
        <div class="text-center mb-10">
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Quick Access</h2>
            <div class="h-1 w-12 bg-brand-accent mx-auto mt-3 rounded-full opacity-80"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <a href="https://usaonline.southalabama.edu/courses/98175/assignments/syllabus" target="_top" class="group relative overflow-hidden bg-white p-5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300 hover:shadow-lg hover:border-blue-200 hover:-translate-y-1">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-50/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative flex items-center justify-between">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform duration-300">
                            📜
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800 group-hover:text-blue-700 transition-colors">Syllabus</h3>
                            <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Course Info</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center text-slate-300 group-hover:border-blue-200 group-hover:bg-blue-600 group-hover:text-white transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </div>
                </div>
            </a>

            <a href="https://usaonline.southalabama.edu/courses/98175/modules" target="_top" class="group relative overflow-hidden bg-white p-5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300 hover:shadow-lg hover:border-violet-200 hover:-translate-y-1">
                <div class="absolute inset-0 bg-gradient-to-r from-violet-50/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative flex items-center justify-between">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 bg-violet-50 text-violet-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform duration-300">
                            📚
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800 group-hover:text-violet-700 transition-colors">Modules</h3>
                            <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Course Content</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center text-slate-300 group-hover:border-violet-200 group-hover:bg-violet-600 group-hover:text-white transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </div>
                </div>
            </a>

            <a href="https://usaonline.southalabama.edu/courses/98175/announcements" target="_top" class="group relative overflow-hidden bg-white p-5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300 hover:shadow-lg hover:border-pink-200 hover:-translate-y-1">
                <div class="absolute inset-0 bg-gradient-to-r from-pink-50/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative flex items-center justify-between">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 bg-pink-50 text-pink-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform duration-300">
                            📢
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800 group-hover:text-pink-700 transition-colors">Announcements</h3>
                            <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Updates</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center text-slate-300 group-hover:border-pink-200 group-hover:bg-pink-600 group-hover:text-white transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </div>
                </div>
            </a>

            <a href="https://usaonline.southalabama.edu/courses/98175/gradebook" target="_top" class="group relative overflow-hidden bg-white p-5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300 hover:shadow-lg hover:border-slate-300 hover:-translate-y-1">
                <div class="absolute inset-0 bg-gradient-to-r from-slate-100/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="relative flex items-center justify-between">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform duration-300">
                            ✅
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800 group-hover:text-slate-700 transition-colors">Grades</h3>
                            <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">Your Progress</p>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center text-slate-300 group-hover:border-slate-300 group-hover:bg-slate-700 group-hover:text-white transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                    </div>
                </div>
            </a>

        </div>
    </section>

    <script src="/assets/js/iframe-resize.js"></script>
</body>
</html>
